name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gameweld
          POSTGRES_PASSWORD: gameweld
          POSTGRES_DB: gameweld_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U gameweld -d gameweld_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://gameweld:gameweld@localhost:5433/gameweld_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Builds the image for every change; on main it is published under the commit's tag, which only
  # becomes `latest` once the checks pass.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/tosiabunio/gameweld:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A green main becomes `latest`, and the server rolls it out (docs/deployment.md).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # The server's host key, pinned so the key is only ever offered to gameweld.eu.
      DEPLOY_HOST_KEY: 146.59.103.109 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINh/o18bJkbTbyqn5pC0iTSCyYkx1JILAWhTo/tn7tq/
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image as latest
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/tosiabunio/gameweld:latest
          ghcr.io/tosiabunio/gameweld:sha-${{ github.sha }}
      # The key may only run the server's deploy script, which asks Dokploy to pull `latest`.
      - name: Roll out on gameweld.eu
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deploy@146.59.103.109 "$GITHUB_SHA"
