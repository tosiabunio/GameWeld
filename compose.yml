# Local stack for work-in-progress builds (implementation plan Section 3.1).
# Driven by the Makefile; you should not need to call docker compose directly.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gameweld
      POSTGRES_PASSWORD: gameweld
      POSTGRES_DB: gameweld
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gameweld -d gameweld']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      AUTH_MOCK: 'true'
      SEED_DEMO: 'true'
      DATABASE_URL: postgres://gameweld:gameweld@db:5432/gameweld
      PORT: '3000'
      WEB_DIST: /app/apps/web/dist
      ATTACHMENTS_DIR: /data/attachments
      # Google sign-in beside the personas, when these are set in the shell or in .env
      # (docs/google-sign-in.md). The OAuth client needs the redirect URI
      # http://localhost:8090/api/auth/google/callback.
      PUBLIC_URL: http://localhost:${APP_PORT:-8090}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
    ports:
      - '${APP_PORT:-8090}:3000'
    volumes:
      - attachments:/data/attachments

  # Throwaway database for `make test`; data lives in memory and is gone when it stops.
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: gameweld
      POSTGRES_PASSWORD: gameweld
      POSTGRES_DB: gameweld_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gameweld -d gameweld_test']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  attachments:
